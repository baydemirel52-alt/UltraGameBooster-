name: Ultra Game Engine - Play Store AAB & APK Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Cek
        uses: actions/checkout@v4

      - name: JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Android SDK Yolu ve Lisanslarini Tanimla
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDK_DIR" > local.properties
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Gradle 8.9 Kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Eski Klasor Kalintilarini Temizle ve Ikonlari Hazirla
        run: |
          rm -rf docs
          if [ -d "app/src/main/java" ]; then
            find app/src/main/java -type f -name "*.kt" ! -path "app/src/main/java/com/selim/ultragameengine/*" -delete
          fi
          rm -f app/src/main/java/com/selim/ultragameengine/EngineManager.kt

          rm -rf app/src/main/res/drawable* app/src/main/res/mipmap*
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          printf '<?xml version="1.0" encoding="utf-8"?>\n<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">\n    <path android:fillColor="#080B12" android:pathData="M0,0h108v108h-108z" />\n    <path android:fillColor="#111927" android:pathData="M0,54a54,54 0,1 0,108 0a54,54 0,1 0,-108 0z" />\n</vector>\n' > app/src/main/res/drawable/ic_launcher_background.xml

          printf '<?xml version="1.0" encoding="utf-8"?>\n<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">\n    <path android:strokeColor="#00E5FF" android:strokeWidth="3.5" android:fillColor="#00000000" android:pathData="M54,24A30,30 0,1 1,24 54A30,30 0,0 1,54 24Z" />\n    <path android:strokeColor="#7C4DFF" android:strokeWidth="2.5" android:fillColor="#1500E5FF" android:pathData="M54,31A23,23 0,1 1,31 54A23,23 0,0 1,54 31Z" />\n    <path android:fillColor="#00E5FF" android:pathData="M58,28L40,56H53L48,80L68,50H55L58,28Z" />\n</vector>\n' > app/src/main/res/drawable/ic_launcher_foreground.xml

          printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@drawable/ic_launcher_background" />\n    <foreground android:drawable="@drawable/ic_launcher_foreground" />\n</adaptive-icon>\n' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          echo "Derlenecek aktif Kotlin dosyalari:"
          find app/src/main/java -type f -name "*.kt"

      - name: Sabit Dijital Imza (Keystore) Olustur
        run: |
          mkdir -p app/keystore
          rm -f app/keystore/release.keystore
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore/release.keystore
          else
            keytool -genkeypair -v \
              -keystore app/keystore/release.keystore \
              -alias ultragamekey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass ultragame123 -keypass ultragame123 \
              -dname "CN=UltraGameEngine, OU=Mobile, O=SelimDev, L=Ordu, S=Ordu, C=TR"
          fi

      - name: Play Store AAB ve Test APK Derle
        run: gradle assembleRelease bundleRelease --stacktrace --no-daemon

      - name: Play Store AAB Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: UltraGameEngine-PlayStore-Bundle-AAB
          path: app/build/outputs/bundle/release/*.aab

      - name: Kurulabilir APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: UltraGameEngine-Installable-APK
          path: app/build/outputs/apk/release/*.apk
